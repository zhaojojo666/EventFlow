server:
  port: 8082
spring:
  application:
    name: eventflow-ticketing
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/eventflow?useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123456}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.eventflow.entity # 别名扫描包
logging:
  level:
    com.eventflow: debug
eventflow:
  upload-dir: ${EVENTFLOW_UPLOAD_DIR:uploads}
  demo-mode: ${EVENTFLOW_DEMO_MODE:false}
